<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#title-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #8b949e;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #c9d1d9;
    }
    .pulse-node {
      animation: pulse 3s infinite alternate ease-in-out;
    }
    .dash-line {
      stroke-dasharray: 8 6;
      animation: dash 20s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -100;
      }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="12"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#30363d" stroke-width="1" opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Background Dynamic Network Flow Lines (Stays Behind Text) -->
  <g fill="none" stroke-width="2" opacity="0.35">
    <!-- Anycast Routing Paths -->
    <path d="M 100 250 Q 300 80 600 220 T 1100 80" stroke="#58a6ff" class="dash-line"/>
    <path d="M 50 100 Q 400 280 800 120 T 1150 220" stroke="#bc8cff" class="dash-line"/>
    <path d="M 200 40 Q 700 260 1000 50" stroke="#3fb950" class="dash-line"/>
  </g>

  <!-- Network Node Visual Accents (Right Side & Background) -->
  <g opacity="0.6">
    <circle cx="950" cy="120" r="40" fill="url(#glow-grad)" filter="url(#glow)"/>
    <circle cx="950" cy="120" r="6" fill="#58a6ff"/>
    
    <circle cx="1080" cy="200" r="30" fill="url(#glow-grad)" filter="url(#glow)"/>
    <circle cx="1080" cy="200" r="5" fill="#bc8cff"/>

    <circle cx="850" cy="220" r="35" fill="url(#glow-grad)" filter="url(#glow)"/>
    <circle cx="850" cy="220" r="5" fill="#3fb950"/>

    <line x1="850" y1="220" x2="950" y2="120" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="950" y1="120" x2="1080" y2="200" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4"/>
  </g>

  <!-- Foreground Content (Guaranteed Foreground Visibility) -->
  <g transform="translate(60, 0)">
    <!-- Main Title -->
    <text x="0" y="115" class="title">Awesome Global Network Traffic Acceleration 🌍 🚀</text>
    
    <!-- Subtitle -->
    <text x="0" y="158" class="subtitle">Anycast Routing • BGP Steering • Global Server Load Balancing • Edge Acceleration</text>
    
    <!-- Feature Pill Badges in Foreground -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: Anycast Routing -->
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="18" cy="17" r="5" fill="#58a6ff"/>
      <text x="32" y="22" class="badge-text">Anycast Routing</text>

      <!-- Pill 2: BGP Optimization -->
      <rect x="175" y="0" width="175" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="193" cy="17" r="5" fill="#bc8cff"/>
      <text x="207" y="22" class="badge-text">BGP Optimization</text>

      <!-- Pill 3: Edge CDN & WAF -->
      <rect x="365" y="0" width="150" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="383" cy="17" r="5" fill="#3fb950"/>
      <text x="397" y="22" class="badge-text">Edge CDN &amp; WAF</text>

      <!-- Pill 4: Open Source Stack -->
      <rect x="530" y="0" width="175" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="548" cy="17" r="5" fill="#d29922"/>
      <text x="562" y="22" class="badge-text">Open Source Stack</text>
    </g>
  </g>
</svg>
